name: Build Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up fork signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          foreach ($name in @('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Missing GitHub Actions secret: $name"
            }
          }
          $keystore = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE 'android\\mhgu.keystore'), $keystore)
          $properties = "storePassword=$env:ANDROID_KEYSTORE_PASSWORD`nkeyAlias=$env:ANDROID_KEY_ALIAS`nkeyPassword=$env:ANDROID_KEY_PASSWORD`n"
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'android\\keystore.properties'), $properties, [Text.Encoding]::ASCII)

      - name: Verify fork signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $keystorePath = Join-Path $env:GITHUB_WORKSPACE 'android\\mhgu.keystore'
          & keytool -list -keystore $keystorePath -storetype PKCS12 -storepass $env:ANDROID_KEYSTORE_PASSWORD -alias $env:ANDROID_KEY_ALIAS
          if ($LASTEXITCODE -ne 0) { throw "The configured fork signing key could not be opened." }

      - name: Set up Python for Phone Builder packaging
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages at the path expected by Khorne build scripts
        shell: pwsh
        run: |
          $sdk = Join-Path $env:LOCALAPPDATA 'Android\Sdk'
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null

          $toolsRoot = $env:ANDROID_SDK_ROOT
          if (-not $toolsRoot) { $toolsRoot = $env:ANDROID_HOME }
          if (-not $toolsRoot) { $toolsRoot = $sdk }

          $manager = Get-ChildItem -Path (Join-Path $toolsRoot 'cmdline-tools') -Filter sdkmanager.bat -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $manager) {
            throw "sdkmanager.bat was not found under $toolsRoot"
          }

          # setup-android accepted licenses for its default SDK directory (C:\\Android\\android-sdk).
          # Khorne's native scripts use %LOCALAPPDATA%\\Android\\Sdk, so accept them again for this SDK root.
          $licenseAnswers = (1..30 | ForEach-Object { 'y' }) -join "`n"
          $licenseAnswers | & $manager.FullName "--sdk_root=$sdk" "--licenses"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $manager.FullName "--sdk_root=$sdk" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "ANDROID_HOME=$sdk" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV

          foreach ($required in @(
            (Join-Path $sdk 'platforms\android-35'),
            (Join-Path $sdk 'ndk\27.0.12077973'),
            (Join-Path $sdk 'cmake\3.22.1\bin\cmake.exe'),
            (Join-Path $sdk 'cmake\3.22.1\bin\ninja.exe')
          )) {
            if (-not (Test-Path $required)) { throw "Android build component is missing: $required" }
          }

      - name: Set up MSYS2 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          install: git make

      - name: Fetch pinned native dependency sources
        shell: msys2 {0}
        run: bash deps/fetch_sources.sh

      - name: Build SDL3 and shaderc
        shell: msys2 {0}
        env:
          JOBS: 4
        run: bash deps/build_deps.sh arm64-v8a

      - name: Build FFmpeg
        shell: msys2 {0}
        env:
          JOBS: 4
        run: bash deps/build_ffmpeg.sh arm64-v8a

      - name: Build native runtime and Phone Builder tools
        shell: msys2 {0}
        env:
          JOBS: 4
        run: bash native/build_native.sh arm64-v8a Release

      - name: Verify native libraries and Phone Builder bundle
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $native = Join-Path $root 'android\app\src\main\jniLibs\arm64-v8a'
          $required = @(
            'libmain.so',
            'libmhguffmpeg.so',
            'libSDL3.so',
            'libc++_shared.so',
            'libpyrun.so',
            'libzigcc.so'
          )
          foreach ($name in $required) {
            $file = Join-Path $native $name
            if (-not (Test-Path $file)) { throw "Native build output is missing: $file" }
          }

          $builderTools = Join-Path $root 'android\app\src\main\assets\builder\tools.zip'
          if (-not (Test-Path $builderTools)) { throw "Phone Builder bundle is missing: $builderTools" }

      - name: Build Android debug APK
        shell: pwsh
        run: |
          Push-Location android
          try {
            .\gradlew.bat --no-daemon --max-workers=4 assembleDebug
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: mhgu-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
